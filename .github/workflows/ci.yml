name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install server dependencies
        run: |
          cd server
          npm ci || npm install

      - name: Run server tests
        run: |
          cd server
          npm test

      - name: Build server
        run: |
          cd server
          npm run build

      - name: Install frontend dependencies
        run: |
          cd web
          npm ci || npm install

      - name: Build frontend
        run: |
          cd web
          npm run build
