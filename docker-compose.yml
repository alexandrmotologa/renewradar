services:
  renewradar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renewradar
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-mock_token}
      - DEMO_MODE=true
      - PORT=8080
      - DATABASE_PATH=/data/renewradar.db
      - WATCHDOG_INTERVAL_MS=60000
    volumes:
      - renewradar_data:/data

volumes:
  renewradar_data:
