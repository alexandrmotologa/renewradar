<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <!-- Electric Cyan Telemetry Gradient -->
    <linearGradient id="cyan-optic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Warm Amber Sentinel Core Gradient -->
    <linearGradient id="amber-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Titanium Slate Facet Gradients (Volumetric 45-degree Lighting) -->
    <linearGradient id="facet-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="facet-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="facet-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="facet-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="facet-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.14" />
    </filter>

    <filter id="optic-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00f5ff" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container (Developer-Branding Formula) -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <!-- Concentric Dashed Cyan Radar Ring -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Parabolic Radar Wave Background Arcs -->
      <circle cx="0" cy="-20" r="315" fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.1" />
      <circle cx="0" cy="-20" r="230" fill="none" stroke="#00f5ff" stroke-width="2" opacity="0.16" />
      <circle cx="0" cy="-20" r="145" fill="none" stroke="#00f5ff" stroke-width="2" opacity="0.24" />

      <!-- 100% Watertight Solid Base Silhouette (Zero-Leak Rule) -->
      <path d="
        M 0,-185
        L 90,-240 L 175,-335 L 180,-190 L 255,-120 L 285,-15 L 260,105 L 190,235 L 110,340 L 0,380
        L -110,340 L -190,235 L -260,105 L -285,-15 L -255,-120 L -180,-190 L -175,-335 L -90,-240
        Z
      " fill="#060911" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />

      <!-- ================= SENTINEL EAR TUFTS / HORNS ================= -->
      <!-- Left Ear Horn -->
      <polygon points="0,-185 -90,-240 -175,-335 -120,-205" fill="url(#facet-mid)" />
      <polygon points="-90,-240 -175,-335 -180,-190 -120,-205" fill="url(#facet-dark)" />
      <polygon points="-175,-335 -180,-190 -140,-170" fill="url(#facet-deep)" />

      <!-- Right Ear Horn (Key light side from top-right) -->
      <polygon points="0,-185 90,-240 175,-335 120,-205" fill="url(#facet-bright)" />
      <polygon points="90,-240 175,-335 180,-190 120,-205" fill="url(#facet-light)" />
      <polygon points="175,-335 180,-190 140,-170" fill="url(#facet-mid)" />

      <!-- Forehead Crown Center Facets -->
      <polygon points="0,-185 -120,-205 0,-125" fill="url(#facet-dark)" />
      <polygon points="0,-185 120,-205 0,-125" fill="url(#facet-light)" />

      <!-- ================= ACOUSTIC RADAR FACIAL DISCS ================= -->
      <!-- Left Facial Disc (Outer rim) -->
      <polygon points="-180,-190 -255,-120 -180,-60" fill="url(#facet-dark)" />
      <polygon points="-255,-120 -285,-15 -180,-15" fill="url(#facet-deep)" />
      <polygon points="-285,-15 -260,105 -165,80" fill="url(#facet-dark)" />

      <!-- Right Facial Disc (Outer rim) -->
      <polygon points="180,-190 255,-120 180,-60" fill="url(#facet-light)" />
      <polygon points="255,-120 285,-15 180,-15" fill="url(#facet-bright)" />
      <polygon points="285,-15 260,105 165,80" fill="url(#facet-light)" />

      <!-- Left Inner Radar Disc Concavity -->
      <polygon points="0,-125 -120,-205 -180,-60 -95,-40" fill="url(#facet-dark)" />
      <polygon points="-180,-60 -180,-15 -95,-15" fill="url(#facet-mid)" />
      <polygon points="-180,-15 -165,80 -75,70" fill="url(#facet-dark)" />
      <polygon points="-95,-40 -180,-60 -95,-15" fill="url(#facet-deep)" />

      <!-- Right Inner Radar Disc Concavity -->
      <polygon points="0,-125 120,-205 180,-60 95,-40" fill="url(#facet-light)" />
      <polygon points="180,-60 180,-15 95,-15" fill="url(#facet-bright)" />
      <polygon points="180,-15 165,80 75,70" fill="url(#facet-mid)" />
      <polygon points="95,-40 180,-60 95,-15" fill="url(#facet-dark)" />

      <!-- ================= PREDATOR ALMOND RADAR EYES ================= -->
      <!-- Left Eye Dark Socket (sharp 25-degree upward predatory cant) -->
      <polygon points="-150,-70 -65,-80 -50,-30 -130,-18" fill="#04060a" stroke="#1e293b" stroke-width="2" />
      <!-- Left Glowing Electric Cyan Iris -->
      <polygon points="-135,-62 -75,-72 -60,-36 -118,-27" fill="url(#cyan-optic)" filter="url(#optic-glow)" />
      <!-- Left Focused Core Slit / Photodiode -->
      <polygon points="-102,-63 -88,-65 -84,-34 -98,-32" fill="#ffffff" />
      <!-- Left Sentinel Amber Reticle Node -->
      <circle cx="-92" cy="-48" r="4" fill="url(#amber-core)" />

      <!-- Right Eye Dark Socket (sharp 25-degree upward predatory cant) -->
      <polygon points="150,-70 65,-80 50,-30 130,-18" fill="#04060a" stroke="#1e293b" stroke-width="2" />
      <!-- Right Glowing Electric Cyan Iris -->
      <polygon points="135,-62 75,-72 60,-36 118,-27" fill="url(#cyan-optic)" filter="url(#optic-glow)" />
      <!-- Right Focused Core Slit / Photodiode -->
      <polygon points="102,-63 88,-65 84,-34 98,-32" fill="#ffffff" />
      <!-- Right Sentinel Amber Reticle Node -->
      <circle cx="92" cy="-48" r="4" fill="url(#amber-core)" />

      <!-- Central Brow Bridge (Between eyes) -->
      <polygon points="0,-125 -65,-80 -50,-30 0,-65" fill="url(#facet-dark)" />
      <polygon points="0,-125 65,-80 50,-30 0,-65" fill="url(#facet-light)" />

      <!-- ================= PREDATOR HOOKED BEAK ================= -->
      <polygon points="0,-65 -30,-15 0,55" fill="url(#facet-dark)" />
      <polygon points="0,-65 30,-15 0,55" fill="url(#facet-bright)" />
      <polygon points="0,55 -16,88 0,110" fill="url(#facet-deep)" />
      <polygon points="0,55 16,88 0,110" fill="url(#facet-light)" />
      <line x1="0" y1="-65" x2="0" y2="110" stroke="#00f5ff" stroke-width="2.5" opacity="0.8" />

      <!-- ================= CHEST & WING ARMOR PLATES ================= -->
      <!-- Left Wing Facets -->
      <polygon points="-260,105 -190,235 -115,185 -165,80" fill="url(#facet-dark)" />
      <polygon points="-190,235 -110,340 -60,255 -115,185" fill="url(#facet-deep)" />

      <!-- Right Wing Facets -->
      <polygon points="260,105 190,235 115,185 165,80" fill="url(#facet-light)" />
      <polygon points="190,235 110,340 60,255 115,185" fill="url(#facet-dark)" />

      <!-- Center Breastplate Keel -->
      <polygon points="0,110 -75,70 -115,185 0,175" fill="url(#facet-dark)" />
      <polygon points="0,110 75,70 115,185 0,175" fill="url(#facet-bright)" />

      <polygon points="0,175 -115,185 -60,255 0,248" fill="url(#facet-deep)" />
      <polygon points="0,175 115,185 60,255 0,248" fill="url(#facet-light)" />

      <polygon points="0,248 -60,255 -110,340 0,380" fill="url(#facet-dark)" />
      <polygon points="0,248 60,255 110,340 0,380" fill="url(#facet-bright)" />

      <!-- Telemetry Keel Chevrons -->
      <polygon points="0,175 -48,142 -38,137 0,165 38,137 48,142" fill="#00f5ff" opacity="0.85" />
      <polygon points="0,248 -38,218 -28,213 0,238 28,213 38,218" fill="#00f5ff" opacity="0.65" />
      <polygon points="0,320 -28,290 -20,285 0,310 20,285 28,290" fill="#fbbf24" opacity="0.75" />

    </g>
  </g>
</svg>